<style>
  :root { --ground: #0d0b16; --ink: #f3ecff; --gold: #f5c542; }
  html, body {
    height: 100%; margin: 0; background: var(--ground); color: var(--ink);
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--ground);
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; outline: none; }
  #rotate {
    position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; padding: 0 24px; background: var(--ground); text-align: center;
    font: 12px/1.9 "Press Start 2P", ui-monospace, Menlo, monospace; color: var(--ink);
  }
  #rotate .ph { width: 40px; height: 70px; border: 4px solid var(--ink); border-radius: 8px; animation: rot 2.4s ease-in-out infinite; }
  #rotate[hidden] { display: none; }
  #rotate b { color: var(--gold); font-weight: normal; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { #rotate .ph { animation: none; transform: rotate(-90deg); } }
</style>

function drawFill(g, ox, st, v, deep) {
  const f = deep ? 0.78 : 1;
  const base = shade(st.base, f), light = shade(st.light, f), dark = shade(st.dark, f);
  const Rn = mulberry32(v * 131 + (deep ? 7 : 0) + hashStr(st.style));
  const p = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(ox + x, y, w, h); };
  p(0, 0, 16, 16, base);
  switch (st.style) {
    case 'speckle':
      for (let i = 0; i < 9; i++) { const x = (Rn() * 14) | 0, y = (Rn() * 15) | 0; p(x, y, 2, 1, dark); if (Rn() < 0.5) p(x, y + 1, 1, 1, dark); }
      for (let i = 0; i < 4; i++) p((Rn() * 15) | 0, (Rn() * 15) | 0, 1, 1, light);
      break;
    case 'cobble':
      p(0, 0, 16, 16, dark);
      for (let row = 0; row < 2; row++) {
        const off = (row + v) % 2 ? 4 : 0;
        for (let bx = -8; bx < 16; bx += 8) {
          const x0 = bx + off, xs = Math.max(0, x0 + 1), xe = Math.min(16, x0 + 8);
          if (xe > xs) { p(xs, row * 8 + 1, xe - xs, 6, base); p(xs, row * 8 + 1, xe - xs, 1, light); if (x0 + 1 >= 0) p(xs, row * 8 + 1, 1, 6, light); }
        }
      }
      break;
    case 'brick':
      p(0, 0, 16, 16, dark);
      for (let row = 0; row < 4; row++) { const off = row % 2 ? 4 : 0; for (let bx = -8; bx < 16; bx += 8) { const x0 = bx + off, xs = Math.max(0, x0), xe = Math.min(16, x0 + 7); if (xe > xs) p(xs, row * 4, xe - xs, 3, hash(bx, row, v) < 0.3 ? light : base); } }
      break;
    case 'plank':
      for (let row = 0; row < 4; row++) { p(0, row * 4, 16, 3, row % 2 ? base : light); p(0, row * 4 + 3, 16, 1, dark); p(((hash(row, v, 5) * 14) | 0) + 1, row * 4, 1, 3, dark); p(2, row * 4 + 1, 1, 1, dark); }
      break;
    case 'strata':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const k = ((y + Math.round(Math.sin((x + v * 5) * 0.5) * 1.5)) >> 2) & 3; if (k === 1) p(x, y, 1, 1, light); else if (k === 3) p(x, y, 1, 1, dark); }

}
function drawTop(g, ox, th, v) {
  drawFill(g, ox, th.fill, v, false);
  const t = th.top, Rn = mulberry32(v * 977 + hashStr(t.style));

function buildSheet(th) {
  const c = mk(9 * 16, 16), g = c.getContext('2d');

function update() {
  G.t++;
  pollButtons();
  if (G.trans) {
    const tr = G.trans; tr.t++;
    if (tr.phase === 'out' && tr.t >= 22) { tr.cb(); tr.phase = 'in'; tr.t = 0; }
    else if (tr.phase === 'in' && tr.t >= 22) G.trans = null;
  }
  const inBtns = bs => { for (const t of taps) { const b = bs.find(b => inR(t, b)); if (b) { sfx.select(); b.act(); return true; } } return false; };
  switch (G.state) {
    case 'title':
      if (world) { cam.x = (G.t * 0.35) % Math.max(1, world.w * TS - VW - 200); cam.y = clamp(15 * TS - VH * 0.72, 0, world.h * TS - VH); }

        inBtns(titleButtons());
        for (const k of keyTaps) if (k === 'Enter' || k === 'Space' || k === 'KeyZ') { if (!save.device) save.device = 'keys'; startGame(); }
      }
      break;
    case 'worlds': updateWorlds(); break;
    case 'play': {
      const L = layout();
      for (const t of taps) {
        if (inR(t, L.pause, 3)) { G.state = 'pause'; sfx.select(); break; }
        if (world.home && inR(t, L.build, 3)) { toggleBuild(); continue; }
        if (!world.home && save.ride && save.vehicles[save.ride] && inR(t, L.ride, 3)) { toggleRide(); continue; }
        if (G.build) {
          const rs = hotbarRects(), i = rs.findIndex(r => inR(t, r, 1));
          if (i === 0) { G.tab = G.tab === 'blocks' ? 'props' : 'blocks'; G.sel = 0; sfx.select(); continue; }
          if (i > 0) { G.sel = i - 1; sfx.select(); continue; }
        }
        if (isTouch() && (inR(t, L.dpad) || inR(t, L.jumpZ) || inR(t, L.punchZ))) continue;
        if (G.build && !G.trans) buildTap(t);
      }
      for (const k of keyTaps) {
        if (k === 'Escape' || k === 'KeyP') { G.state = 'pause'; }
        else if (k === 'KeyB') toggleBuild();
        else if (k === save.keys.vehicle) toggleRide();
        else if (k === 'Tab' && G.build) { G.tab = G.tab === 'blocks' ? 'props' : 'blocks'; G.sel = 0; }

    }
    case 'clear':

      if (G.clearT === 150) toHub(world.spec.n === 16 ? 'WORLD CLEARED!' : null);
      break;
    case 'pause':
      inBtns(pauseButtons());

      break;
    case 'settings':
      inBtns(settingsButtons());
      for (const k of keyTaps) if (k === 'Escape') closeSettings();
      break;
    case 'keys':
      if (G.keyWait) {
        for (const k of keyTaps) {
          if (k === 'Escape') { G.keyWait = null; break; }
          for (const id in save.keys) if (save.keys[id] === k && id !== G.keyWait) save.keys[id] = save.keys[G.keyWait];
          save.keys[G.keyWait] = k; G.keyWait = null; G.dirty = true; sfx.select(); break;
        }

    case 'garage': updateGarage(); break;

    panel(p.x - 7, p.y + 17, 14, 11, 0.95, i === W.cur ? '#f5c542' : '#e9e4f5'); text(String(i + 1), p.x, p.y + 20, '#ffffff', 1, 'center');
    if (i >= PLAYABLE && !save.admin) { const bx = p.x + 10, by = p.y + 8; fr(bx + 1, by + 5, 1, 5, '#5a3a1e'); fr(bx + 12, by + 5, 1, 5, '#5a3a1e'); fr(bx - 1, by - 1, 16, 7, OUT); for (let k = 0; k < 14; k++) fr(bx + k, by, 1, 5, ((k >> 1) % 2) ? '#1b1626' : '#f5c542'); if ((G.t >> 4) % 2) fr(bx + 6, by - 4, 2, 2, '#ff6a3a'); }
    else if (save.worlds[i].done) ctx.drawImage(STARI, p.x + 9, p.y + 18);
  }
  const p = wselPos(W.cur), b = Math.abs(Math.sin(G.t * 0.08)) * 3 | 0;
  const c = (G.t >> 3) % 2 ? '#ffffff' : '#f5c542';
  for (const [dx, dy, w, h] of [[-26, -22, 8, 2], [-26, -22, 2, 8], [18, -22, 8, 2], [24, -22, 2, 8], [-26, 20, 8, 2], [-26, 14, 2, 8], [18, 20, 8, 2], [24, 14, 2, 8]]) fr(p.x + dx, p.y + dy, w, h, c);
  if (W.cur < PLAYABLE || save.admin) ctx.drawImage(getHero(save.skin, save.power).stand.r, p.x - 6, p.y - 24 - b);
  panel(4, 4, 150, 16); text('CHOOSE A WORLD', 10, 9, '#f5c542', 1);
  const B = worldsButtons();
  hudButton(B.gear, iconGear, false); uiButton(B.back);
  const th = THEMES[WORLDS[W.cur]], info = 'WORLD ' + (W.cur + 1) + ': ' + th.name;
  const sub = save.admin ? 'ADMIN: LEVELS ' + levelsDone(W.cur) + '/16' : W.cur >= PLAYABLE ? 'UNDER CONSTRUCTION: COMING SOON' : W.cur > save.maxWorld ? 'LOCKED' : 'LEVELS ' + levelsDone(W.cur) + '/16' + (save.worlds[W.cur].done ? '  -  TREASURE FOUND' : '');
  const iw = Math.min(VW - 76, Math.max(textW(info), textW(sub)) + 14);
  panel(4, VH - 26, iw, 22, 0.92); text(info, 10, VH - 22, '#ffffff'); text(sub, 10, VH - 13, '#b8b2cc');
  const ok = save.admin || (W.cur < PLAYABLE && W.cur <= save.maxWorld), e = B.enter;
  panel(e.x, e.y, e.w, e.h, 0.95, ok ? '#f5c542' : '#6a6480'); text('ENTER', e.x + e.w / 2, e.y + 6, ok ? '#ffffff' : '#6a6480', 2, 'center');
  drawToasts(26);
}
function drawTitle() {
  ctx.fillStyle = 'rgba(12,8,30,0.25)'; ctx.fillRect(0, 0, VW, VH);
  const cx = (VW / 2) | 0, sc = VW >= 330 ? 6 : 4, y = (VH * 0.14) | 0, title = 'PIXMOND';
  for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2], [0, 2], [2, 2], [-2, 2], [0, 4], [2, 4], [-2, 4]]) text(title, cx + dx, y + dy, OUT, sc, 'center');
  text(title, cx, y, '#f5c542', sc, 'center');
  ctx.save(); ctx.beginPath(); ctx.rect(0, y, VW, sc * 2); ctx.clip(); text(title, cx, y, '#fff2a0', sc, 'center'); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(0, y + sc * 4, VW, sc); ctx.clip(); text(title, cx, y, '#e0902a', sc, 'center'); ctx.restore();
  textOut('WORLD 1: 16 LEVELS - 7 MORE WORLDS COMING SOON', cx, y + sc * 5 + 10, '#ffffff', OUT, 1, 'center');
  if (!save.device) textOut('WHAT ARE YOU PLAYING ON?', cx, (VH * 0.56 | 0) - 2, '#f5c542', OUT, 1, 'center');
  for (const b of titleButtons()) uiButton(b, b.label === 'PLAY');
  const done = save.worlds.filter(w => w.done).length;
  if (save.tut) textOut('COINS ' + save.coins + '   WORLDS CLEARED ' + done + '/8', cx, VH - 12, '#d8d2ea', OUT, 1, 'center');
}
function drawTransition() {
  const tr = G.trans; if (!tr) return;
  const k = tr.phase === 'out' ? tr.t / 22 : 1 - tr.t / 22;
  const rad = Math.max(0, (1 - k) * Math.hypot(VW, VH) * 0.6);
  let px = VW / 2, py = VH / 2;
  if (G.state === 'play' && player && world) { px = player.x + player.w / 2 - CX; py = player.y + player.h / 2 - CY; }
  ctx.fillStyle = '#05030a'; ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.arc(px, py, rad, 0, Math.PI * 2, true); ctx.fill('evenodd');
}
function render() {
  ctx.imageSmoothingEnabled = false; DC = ctx;
  const s = G.state, under = (s === 'settings' || s === 'keys') ? G.back : (s === 'shop' || s === 'garage') ? 'play' : s;
  if (under === 'worlds') drawWorlds();
  else if (world) {
    renderWorld();
    if (under === 'title') drawTitle();
    else if (under === 'play' || under === 'pause') drawHUD();
    if (s === 'pause' || (s === 'settings' && G.back === 'pause')) { if (s === 'pause') drawPause(); }
    if (s === 'clear') drawClear();
  }
  if (s === 'shop') drawShopUI();
  if (s === 'garage') drawGarageUI();
  if (s === 'settings') drawSettings();
  if (s === 'keys') drawKeys();
  drawTransition();
  if (save.admin && G.state !== 'title') { panel((VW / 2 | 0) - 18, VH - 12, 36, 10, 0.85, '#ff6a3a'); text('ADMIN', VW / 2, VH - 9, '#ff9a6a', 1, 'center'); }
  if (G.goT > 0) { const a = Math.min(1, G.goT / 15); ctx.globalAlpha = a; textOut('GAME OVER', VW / 2, (VH / 2 | 0) - 8, '#ff5a5a', OUT, 3, 'center'); ctx.globalAlpha = 1; }
}

// =====================================================================
//  RESIZE / LOOP / BOOT
// =====================================================================
const rot = document.getElementById('rotate');
function resize() {
  const wrap = document.getElementById('wrap'), cs = getComputedStyle(wrap);
  const aw = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let s = Math.max(1, Math.round(ah / 200));
  while (s > 1 && aw / s < 300) s--;
  VH = Math.max(150, Math.min(240, Math.floor(ah / s))); VW = Math.min(560, Math.max(240, Math.floor(aw / s)));
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW * s + 'px'; canvas.style.height = VH * s + 'px';
  ctx.imageSmoothingEnabled = false;
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  rot.hidden = !(coarse && window.innerHeight > window.innerWidth);
  if (world) { cam.x = clamp(cam.x, 0, world.w * TS - VW); cam.y = clamp(cam.y, 0, world.h * TS - VH); initWeather(); }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
window.addEventListener('pagehide', persist);

let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(t) {
  acc += Math.min(100, t - last); last = t;
  let n = 0;
  while (acc >= STEP && n < 4) { update(); acc -= STEP; n++; }
  if (n === 4) acc = 0;
  render();
  Music.tick();
  requestAnimationFrame(frame);
}

resize();
world = genLevel(makeSpec(0, 1));
player = newPlayer(world.spawn.x, world.spawn.y);
initWeather();
Music.set('meadow');
// Test deep links: #village | #worlds | #world=1 | #level=1-4 | #home
const hsh = location.hash; let m_;
const dev = () => { if (!save.device) save.device = 'keys'; };
if (/village|villaggio/.test(hsh)) { dev(); loadVillage(null); }
else if (/worlds|mondi/.test(hsh)) { dev(); loadVillage('guide'); enterWorlds(); }
else if ((m_ = /(?:world|mondo)=(\d)/.exec(hsh))) { dev(); loadHub(+m_[1] - 1, null); }
else if ((m_ = /(?:level|livello)=(\d)-(\d+)/.exec(hsh))) { dev(); loadLevel(makeSpec(+m_[1] - 1, clamp(+m_[2], 1, 16)), false); }
else if (/home|casa/.test(hsh)) { dev(); loadHome(); }
requestAnimationFrame(frame);
})();
</script>
