<style>
  :root { --ground: #0d0b16; --ink: #f3ecff; --gold: #f5c542; }
  html, body {
    height: 100%; margin: 0; background: var(--ground); color: var(--ink);
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--ground);
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; outline: none; }
  #rotate {
    position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; padding: 0 24px; background: var(--ground); text-align: center;
    font: 12px/1.9 "Press Start 2P", ui-monospace, Menlo, monospace; color: var(--ink);
  }
  #rotate .ph { width: 40px; height: 70px; border: 4px solid var(--ink); border-radius: 8px; animation: rot 2.4s ease-in-out infinite; }
  #rotate[hidden] { display: none; }
  #rotate b { color: var(--gold); font-weight: normal; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (prefers-reduced-motion: reduce) { #rotate .ph { animation: none; transform: rotate(-90deg); } }
</style>

function drawFill(g, ox, st, v, deep) {

  const Rn = mulberry32(v * 131 + (deep ? 7 : 0) + hashStr(st.style));
  const p = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(ox + x, y, w, h); };
  p(0, 0, 16, 16, base);
  switch (st.style) {
    case 'speckle':
      for (let i = 0; i < 9; i++) { const x = (Rn() * 14) | 0, y = (Rn() * 15) | 0; p(x, y, 2, 1, dark); if (Rn() < 0.5) p(x, y + 1, 1, 1, dark); }

      break;
    case 'cobble':
      p(0, 0, 16, 16, dark);
      for (let row = 0; row < 2; row++) {
        const off = (row + v) % 2 ? 4 : 0;
        for (let bx = -8; bx < 16; bx += 8) {
          const x0 = bx + off, xs = Math.max(0, x0 + 1), xe = Math.min(16, x0 + 8);
          if (xe > xs) { p(xs, row * 8 + 1, xe - xs, 6, base); p(xs, row * 8 + 1, xe - xs, 1, light); if (x0 + 1 >= 0) p(xs, row * 8 + 1, 1, 6, light); }
        }
      }
      break;
    case 'brick':
      p(0, 0, 16, 16, dark);
      for (let row = 0; row < 4; row++) { const off = row % 2 ? 4 : 0; for (let bx = -8; bx < 16; bx += 8) { const x0 = bx + off, xs = Math.max(0, x0), xe = Math.min(16, x0 + 7); if (xe > xs) p(xs, row * 4, xe - xs, 3, hash(bx, row, v) < 0.3 ? light : base); } }
      break;
    case 'plank':
      for (let row = 0; row < 4; row++) { p(0, row * 4, 16, 3, row % 2 ? base : light); p(0, row * 4 + 3, 16, 1, dark); p(((hash(row, v, 5) * 14) | 0) + 1, row * 4, 1, 3, dark); p(2, row * 4 + 1, 1, 1, dark); }
      break;
    case 'strata':
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const k = ((y + Math.round(Math.sin((x + v * 5) * 0.5) * 1.5)) >> 2) & 3; if (k === 1) p(x, y, 1, 1, light); else if (k === 3) p(x, y, 1, 1, dark); }

  drawFill(g, ox, th.fill, v, false);
  const t = th.top, Rn = mulberry32(v * 977 + hashStr(t.style));
  const p = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(ox + x, y, w, h); };
  for (let x = 0; x < 16; x++) {
    let d = t.depth;
    if (t.style === 'grass' || t.style === 'snow') d += (Rn() * 3) | 0;
    else if (t.style === 'sand' || t.style === 'seabed' || t.style === 'dirt') d += Math.round(Math.sin((x + v * 5) * 0.7) + 1);
    p(x, 0, 1, 1, OUT); p(x, 1, 1, d - 1, t.base); p(x, 1, 1, 1, t.light); p(x, d - 1, 1, 1, t.dark);
  }
  switch (t.style) {
    case 'grass': for (let i = 0; i < 4; i++) p((Rn() * 15) | 0, 2, 1, 1, t.light); break;
    case 'snow': for (let i = 0; i < 3; i++) p((Rn() * 15) | 0, 2 + ((Rn() * 2) | 0), 1, 1, '#ffffff'); break;
    case 'sand': case 'seabed': case 'dirt':
      for (let i = 0; i < 4; i++) p((Rn() * 15) | 0, 2 + ((Rn() * 2) | 0), 1, 1, t.dark);
      if (t.style === 'seabed' && Rn() < 0.6) p((Rn() * 13) | 0, 2, 2, 1, '#ff9aa0');
      break;
    case 'ash': for (let i = 0; i < 3; i++) p((Rn() * 15) | 0, 1 + ((Rn() * 2) | 0), 1, 1, '#ff7a2e'); break;
    case 'slab': p(v % 2 ? 4 : 11, 1, 1, t.depth - 1, t.dark); break;
    case 'plank': p(v % 2 ? 5 : 12, 1, 1, t.depth - 1, t.dark); p(2, 2, 1, 1, t.dark); break;
    case 'road': p(0, 3, 16, 1, t.dark); for (let x = 0; x < 16; x++) { if ((x + v * 2) % 6 === 0) p(x, 1, 1, 2, t.dark); if ((x + v * 2 + 3) % 6 === 0) p(x, 4, 1, 1, t.dark); } for (let i = 0; i < 3; i++) p((Rn() * 14) | 0, 2, 2, 1, t.light); break;

  for (let v = 0; v < 2; v++) drawFill(g, (6 + v) * 16, th.fill, v, true);

  if (tx < 0 || ty < 0 || tx >= world.w || ty >= world.h) return;
  const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
  if (Math.hypot(tx * TS + 8 - pcx, ty * TS + 8 - pcy) > 7 * TS) { toast('TOO FAR! GET CLOSER', 60); sfx.bump(); return; }
  G.cursor = { tx, ty, t: 20 };
  const pi = propAt(wx, wy);
  if (pi >= 0) { const pr = save.home.props.splice(pi, 1)[0]; save.props[pr.type] = (save.props[pr.type] | 0) + 1; G.dirty = true; sfx.brk(); puff(wx, wy, 10); return; }
  const sel = hotbarList()[G.sel];
  const t = world.map[ty * world.w + tx];
  if (sel && sel.kind === 'prop') {
    if (SOLID[t]) { toast('TAP AN EMPTY SPOT ABOVE THE GROUND', 90); sfx.bump(); return; }
    const P = sel.it;
    if ((save.props[P.id] | 0) <= 0) { toast('NO ' + P.name + '! BUY IT AT THE SHOP', 110); sfx.bump(); return; }
    let gy = ty; while (gy < world.h && !SOLID[world.map[gy * world.w + tx]]) gy++;
    const px = clamp(tx - (P.w >> 1), 0, world.w - P.w);
    for (const o of save.home.props) { const Q = PROPS.find(q => q.id === o.type); if (px < o.x + Q.w && px + P.w > o.x && Math.abs(o.y - gy) < 4) { toast('SOMETHING IS ALREADY HERE', 80); sfx.bump(); return; } }
    save.home.props.push({ type: P.id, x: px, y: gy }); save.props[P.id]--; G.dirty = true; sfx.place(); puff(px * TS + P.w * 8, gy * TS - 8, 10);
    return;
  }
  if (t === T.AIR) {
    const it = sel.it;
    if ((save.inv[it.id] | 0) <= 0) { toast('NO ' + it.name + '! BUY IT AT THE SHOP', 110); sfx.bump(); return; }
    const box = { x: tx * TS, y: ty * TS, w: TS, h: TS };
    if (SOLID[it.tile] && overlap(box, player)) return;
    setTile(tx, ty, it.tile); save.inv[it.id]--; sfx.place(); puff(tx * TS + 8, ty * TS + 8, 4, '#ffffff');
  } else if (t === T.BEDROCK) { toast('UNBREAKABLE ROCK', 60); sfx.bump(); }
  else {
    const id = TILE_ITEM[t]; setTile(tx, ty, T.AIR);
    if (id) save.inv[id] = (save.inv[id] | 0) + 1;
    sfx.brk(); debris(tx * TS + 8, ty * TS + 8, ['#ffffff', '#c8c0b0', '#8a7a6a']);
  }
}

// ---- Weather ----
function initWeather() {
  const type = world ? world.th.particles : null; G.wx = []; G.lastCX = cam.x;
  const n = { snow: 60, embers: 34, bubbles: 26, dust: 22, petals: 12, motes: 22, wisps: 14 }[type] || 0;
  for (let i = 0; i < n; i++) {
    const w = { x: Math.random() * VW, y: Math.random() * VH, ph: Math.random() * 6.28, s: Math.random() < 0.3 ? 2 : 1, vx: 0, vy: 0 };
    if (type === 'snow') { w.vy = 0.3 + Math.random() * 0.5; w.vx = -0.15; }
    else if (type === 'embers') { w.vy = -(0.3 + Math.random() * 0.6); w.vx = 0.1; }
    else if (type === 'bubbles') { w.vy = -(0.3 + Math.random() * 0.4); w.s = 1 + ((Math.random() * 3) | 0); }
    else if (type === 'dust') { w.vx = 1.5 + Math.random() * 2; w.vy = 0.1; }
    else if (type === 'petals') { w.vx = 0.4 + Math.random() * 0.5; w.vy = 0.25; }
    else { w.vx = (Math.random() - 0.5) * 0.2; w.vy = (Math.random() - 0.5) * 0.2; }
    G.wx.push(w);
  }
}
function updateWeather() {
  if (!world) return;
  const type = world.th.particles, dcx = cam.x - G.lastCX; G.lastCX = cam.x;
  const sway = type === 'snow' || type === 'petals' || type === 'wisps';
  for (const w of G.wx) {
    w.x += w.vx + (sway ? Math.sin(G.t * 0.03 + w.ph) * 0.3 : 0) - dcx * 0.6; w.y += w.vy;
    if (w.x < -8) w.x += VW + 16; if (w.x > VW + 8) w.x -= VW + 16;
    if (w.y > VH + 6) w.y = -4; if (w.y < -8) w.y = VH + 4;
  }
}
function drawWeather() {
  const type = world.th.particles;
  for (const w of G.wx) {
    const x = w.x | 0, y = w.y | 0;
    switch (type) {
      case 'snow': fr(x, y, w.s, w.s, w.s > 1 ? '#ffffff' : '#dfe8f5'); break;
      case 'embers': fr(x, y, w.s, w.s, (G.t + w.ph * 10) % 20 < 10 ? '#ffb02e' : '#ff5a1e'); break;
      case 'bubbles': { const s = w.s; ctx.fillStyle = 'rgba(220,245,255,0.7)'; ctx.fillRect(x, y - s, 1, 1); ctx.fillRect(x - s, y, 1, 1); ctx.fillRect(x + s, y, 1, 1); ctx.fillRect(x, y + s, 1, 1); break; }
      case 'dust': fr(x, y, 4, 1, 'rgba(255,230,170,0.45)'); break;
      case 'petals': fr(x, y, 2, 1, w.ph > 3 ? '#ffd0e0' : '#ffffff'); break;
      case 'motes': fr(x, y, 1, 1, 'rgba(255,240,200,0.5)'); break;
      case 'wisps': { const a = 0.35 + 0.3 * Math.sin(G.t * 0.05 + w.ph); fr(x, y, 2, 2, `rgba(200,150,255,${a.toFixed(2)})`); break; }
    }
  }
}

//  UPDATE
// =====================================================================
function update() {
  G.t++;
  if (UPD.pending) tickUpdate();
  pollButtons();
  if (G.trans) {
    const tr = G.trans; tr.t++;
    if (tr.phase === 'out' && tr.t >= 22) { tr.cb(); tr.phase = 'in'; tr.t = 0; }
    else if (tr.phase === 'in' && tr.t >= 22) G.trans = null;
  }
  const inBtns = bs => { for (const t of taps) { const b = bs.find(b => inR(t, b)); if (b) { sfx.select(); b.act(); return true; } } return false; };
  switch (G.state) {
    case 'title':
      if (world) { cam.x = (G.t * 0.35) % Math.max(1, world.w * TS - VW - 200); cam.y = clamp(15 * TS - VH * 0.72, 0, world.h * TS - VH); }
      if (!G.trans) {
        inBtns(titleButtons());
        for (const k of keyTaps) if (k === 'Enter' || k === 'Space' || k === 'KeyZ') { if (!save.device) save.device = 'keys'; startGame(); }
      }
      break;
    case 'worlds': updateWorlds(); break;
    case 'play': {
      const L = layout();
      for (const t of taps) {
        if (inR(t, L.pause, 3)) { G.state = 'pause'; sfx.select(); break; }
        if (world.home && inR(t, L.build, 3)) { toggleBuild(); continue; }
        if (!world.home && save.ride && save.vehicles[save.ride] && inR(t, L.ride, 3)) { toggleRide(); continue; }
        if (G.build) {
          const rs = hotbarRects(), i = rs.findIndex(r => inR(t, r, 1));
          if (i === 0) { G.tab = G.tab === 'blocks' ? 'props' : 'blocks'; G.sel = 0; sfx.select(); continue; }
          if (i > 0) { G.sel = i - 1; sfx.select(); continue; }
        }
        if (isTouch() && (inR(t, L.dpad) || inR(t, L.jumpZ) || inR(t, L.punchZ))) continue;
        if (G.build && !G.trans) buildTap(t);
      }
      for (const k of keyTaps) {
        if (k === 'Escape' || k === 'KeyP') { G.state = 'pause'; }
        else if (k === 'KeyB') toggleBuild();
        else if (k === save.keys.vehicle) toggleRide();
        else if (k === 'Tab' && G.build) { G.tab = G.tab === 'blocks' ? 'props' : 'blocks'; G.sel = 0; }

const rot = document.getElementById('rotate');
function resize() {
  const wrap = document.getElementById('wrap'), cs = getComputedStyle(wrap);
  const aw = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let s = Math.max(1, Math.round(ah / 200));
  while (s > 1 && aw / s < 300) s--;

  rot.hidden = !(coarse && window.innerHeight > window.innerWidth);

// =====================================================================
//  AUTO UPDATE  (keeps the home-screen web app in sync without reinstalling)
// =====================================================================
const APP_VERSION = (document.querySelector('meta[name="app-version"]') || {}).content || '0';
const UPD = { latest: APP_VERSION, pending: false, checking: false, applying: false, warned: false, last: 0 };

function updateLabel() {
  if (UPD.applying) return 'UPDATING...';
  if (UPD.pending) return 'INSTALL UPDATE NOW!';
  if (UPD.checking) return 'CHECKING FOR UPDATES...';
  return 'FORCE UPDATE  (V' + APP_VERSION + ')';
}
async function wipeCaches() {
  try { if (window.caches && caches.keys) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } } catch (e) { /* ignore */ }
  try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister())); } } catch (e) { /* ignore */ }
}
const TRY_KEY = 'pixmond_update_try';
const lastTry = (() => { try { return sessionStorage.getItem(TRY_KEY) || ''; } catch (e) { return ''; } })();
async function applyUpdate(tag) {
  if (UPD.applying) return;
  UPD.applying = true;
  try { sessionStorage.setItem(TRY_KEY, String(tag)); } catch (e) { /* ignore */ }
  try { persist(); } catch (e) { /* ignore */ }
  await wipeCaches();
  // A fresh query string is the only thing Safari cannot serve from its cache.
  location.replace(location.href.split('#')[0].split('?')[0] + '?v=' + encodeURIComponent(tag || Date.now()) + location.hash);
}
async function checkUpdate(loud) {
  if (UPD.applying || UPD.checking) return;
  UPD.checking = true; UPD.last = Date.now();
  try {
    const r = await fetch('version.json?cb=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const v = String((await r.json()).version || '');
    UPD.checking = false;
    if (v && v !== APP_VERSION) { if (v !== UPD.latest) UPD.warned = false; UPD.latest = v; UPD.pending = true; tickUpdate(); }
    else if (loud) toast('ALREADY UP TO DATE', 120);
  } catch (e) {
    UPD.checking = false;
    if (loud) toast('UPDATE CHECK FAILED', 120);
  }
}
function tickUpdate() {
  if (!UPD.pending || UPD.applying) return;
  // Never yank the ground from under an active run: wait for a menu.
  if (G.state === 'play' || G.trans) { if (!UPD.warned) { UPD.warned = true; toast('UPDATE READY - PAUSE TO INSTALL', 220); } return; }
  // Already reloaded once for this version and still got the old page: stop
  // auto-reloading and leave it to the settings button, so we never loop.
  if (lastTry === UPD.latest) { if (!UPD.warned) { UPD.warned = true; toast('UPDATE READY - SEE SETTINGS', 220); } return; }
  applyUpdate(UPD.latest);
}

}
function startUpdateWatch() {

  document.addEventListener('visibilitychange', wake);
  window.addEventListener('focus', wake);
  window.addEventListener('pageshow', wake);
  window.addEventListener('online', wake);
}

let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(t) {
  acc += Math.min(100, t - last); last = t;
  let n = 0;
  while (acc >= STEP && n < 4) { update(); acc -= STEP; n++; }
  if (n === 4) acc = 0;
  render();
  Music.tick();
  requestAnimationFrame(frame);
}
